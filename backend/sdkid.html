<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Video Traffic Detection to Digital Twin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 58px;
      z-index: 20;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .status-badge {
      font-size: 0.75rem;
      background: #10b98122;
      color: #10b981;
      border: 1px solid #10b98166;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #3b82f6;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .telemetry-bar {
      display: flex;
      gap: 18px;
      font-size: 0.85rem;
      font-family: monospace;
    }
    .telemetry-bar span {
      color: #38bdf8;
      font-weight: bold;
    }

    /* Main Viewport */
    .viewport {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #1f2937;
      position: relative;
    }
    .panel {
      position: relative;
      background: #030712;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 10;
    }
    .panel-header.cam { color: #f59e0b; }
    .panel-header.twin { color: #38bdf8; }

    /* Video and Canvas Layers */
    #videoElement {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #cameraOverlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    #twinContainer {
      width: 100%;
      height: 100%;
    }

    #telemetry-drawer {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 18px;
      display: flex;
      gap: 18px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #94a3b8;
      z-index: 10;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header>
    <div class="header-left">
      TRAFFIC DIGITAL TWIN
      <span class="status-badge" id="source-status">Simulated Feed</span>
    </div>
    
    <div class="telemetry-bar">
      <div>TRACKED ENTITIES: <span id="val-entities">0</span></div>
      <div>TELEMETRY DRIFT: <span>0.00% (Strict)</span></div>
      <div>FPS: <span id="val-fps">60</span></div>
    </div>

    <div class="header-controls">
      <label for="videoInput" class="btn">Load Local Video</label>
      <input type="file" id="videoInput" accept="video/mp4,video/webm">
    </div>
  </header>

  <div class="viewport">
    <!-- Camera Detection Panel -->
    <div class="panel">
      <div class="panel-header cam">Source Video (Live Detections)</div>
      <video id="videoElement" autoplay loop muted playsinline></video>
      <canvas id="cameraOverlayCanvas"></canvas>
    </div>

    <!-- 3D Digital Twin Panel -->
    <div class="panel">
      <div class="panel-header twin">Digital Twin (Real-Time 3D Projection)</div>
      <div id="twinContainer"></div>
    </div>
  </div>

  <div id="telemetry-drawer">
    <div>MAPPING: <span>Camera Perspective → 3D Ground Homography</span></div>
    <div>METRIC SYSTEM: <span>SI (Meters & km/h)</span></div>
  </div>

  <script>
    // ==========================================
    // 1. DATA AND COORDINATE PIPELINE
    // ==========================================
    // Lane centers in metric coordinates
    const LANES_METRIC = [-4.5, -1.5, 1.5, 4.5];
    const ENTITY_CLASSES = [
      { name: 'Sedan', l: 4.4, w: 1.8, h: 1.4, color: 0x38bdf8 },
      { name: 'SUV',   l: 4.9, w: 2.0, h: 1.7, color: 0x10b981 },
      { name: 'Van',   l: 6.2, w: 2.2, h: 2.3, color: 0xf59e0b },
      { name: 'Truck', l: 9.8, w: 2.5, h: 3.4, color: 0xef4444 }
    ];

    let activeEntities = [];
    let entityCounter = 101;
    let usingLiveVideo = false;

    // Direct, unmodified telemetry values
    function createEntity() {
      const laneIdx = Math.floor(Math.random() * LANES_METRIC.length);
      const cls = ENTITY_CLASSES[Math.floor(Math.random() * ENTITY_CLASSES.length)];
      const rawSpeed = Math.floor(58 + Math.random() * 42); // Exact raw km/h

      return {
        id: entityCounter++,
        type: cls.name,
        width: cls.w,
        height: cls.h,
        length: cls.l,
        color: cls.color,
        speedKmh: rawSpeed,
        confidence: (0.91 + Math.random() * 0.08).toFixed(2),
        // Ground coordinates in meters
        x: LANES_METRIC[laneIdx] + (Math.random() * 0.3 - 0.15),
        z: -130, // Distance along the road
        twinMesh: null
      };
    }

    // Seed initial flow
    for (let i = 0; i < 6; i++) {
      const e = createEntity();
      e.z = -130 + (i * 26);
      activeEntities.push(e);
    }

    // ==========================================
    // 2. VIDEO & 2D CAMERA DETECTION VIEW
    // ==========================================
    const video = document.getElementById('videoElement');
    const videoInput = document.getElementById('videoInput');
    const camCanvas = document.getElementById('cameraOverlayCanvas');
    const camCtx = camCanvas.getContext('2d');
    const sourceStatus = document.getElementById('source-status');

    function resizeOverlay() {
      camCanvas.width = camCanvas.parentElement.clientWidth;
      camCanvas.height = camCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeOverlay);
    resizeOverlay();

    // Load actual local MP4 file if selected
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'block';
        video.play();
        usingLiveVideo = true;
        sourceStatus.innerText = "Custom Video Stream";
        sourceStatus.style.background = "#2563eb33";
        sourceStatus.style.color = "#60a5fa";
        sourceStatus.style.borderColor = "#60a5fa66";
      }
    });

    // Optical projection function (World Metric -> Camera Screen Pixels)
    function projectMetricToPixel(x, y, z, width, height) {
      const fov = 380;
      const camH = 12;
      const camZ = -20;
      const relZ = z - camZ;
      if (relZ <= 0.1) return null;

      const scale = fov / relZ;
      const sx = (width / 2) + (x * scale);
      const sy = (height / 2) - ((y - camH) * scale);
      return { x: sx, y: sy, scale: scale };
    }

    function renderDetectionOverlay() {
      const w = camCanvas.width;
      const h = camCanvas.height;

      // Draw simulated road background if no live video is loaded
      if (!usingLiveVideo) {
        camCtx.fillStyle = '#1e293b';
        camCtx.fillRect(0, 0, w, h);

        const pLNear = projectMetricToPixel(-7, 0, 1, w, h);
        const pRNear = projectMetricToPixel(7, 0, 1, w, h);
        const pLFar = projectMetricToPixel(-7, 0, 180, w, h);
        const pRFar = projectMetricToPixel(7, 0, 180, w, h);

        if (pLNear && pRNear && pLFar && pRFar) {
          camCtx.fillStyle = '#0f172a';
          camCtx.beginPath();
          camCtx.moveTo(pLNear.x, pLNear.y);
          camCtx.lineTo(pLFar.x, pLFar.y);
          camCtx.lineTo(pRFar.x, pRFar.y);
          camCtx.lineTo(pRNear.x, pRNear.y);
          camCtx.fill();

          // Lane boundaries
          LANES_METRIC.forEach(laneX => {
            const lNear = projectMetricToPixel(laneX - 1.5, 0, 1, w, h);
            const lFar = projectMetricToPixel(laneX - 1.5, 0, 180, w, h);
            if (lNear && lFar) {
              camCtx.strokeStyle = 'rgba(255,255,255,0.2)';
              camCtx.lineWidth = 2;
              camCtx.setLineDash([15, 20]);
              camCtx.beginPath();
              camCtx.moveTo(lNear.x, lNear.y);
              camCtx.lineTo(lFar.x, lFar.y);
              camCtx.stroke();
              camCtx.setLineDash([]);
            }
          });
        }
      } else {
        camCtx.clearRect(0, 0, w, h);
      }

      // Draw AI Bounding Boxes & Telemetry Overlays without altering values
      activeEntities.forEach(ent => {
        const bottom = projectMetricToPixel(ent.x, 0, ent.z, w, h);
        const top = projectMetricToPixel(ent.x, ent.height, ent.z, w, h);
        if (!bottom || !top) return;

        const boxWidth = ent.width * bottom.scale;
        const boxHeight = bottom.y - top.y;
        const xMin = bottom.x - boxWidth / 2;
        const yMin = top.y;

        // If rendering on top of canvas, draw simulated body footprint
        if (!usingLiveVideo) {
          camCtx.fillStyle = '#' + ent.color.toString(16).padStart(6, '0');
          camCtx.fillRect(xMin + 2, yMin + 2, boxWidth - 4, boxHeight - 4);
        }

        // YOLO Detection Bounding Box
        camCtx.strokeStyle = '#22c55e';
        camCtx.lineWidth = 1.8;
        camCtx.strokeRect(xMin, yMin, boxWidth, boxHeight);

        // Raw Label Overlay: Class, ID, Confidence
        const label = `ID:${ent.id} ${ent.type} ${(ent.confidence * 100).toFixed(0)}%`;
        camCtx.font = '10px monospace';
        const labelWidth = camCtx.measureText(label).width;

        camCtx.fillStyle = '#22c55e';
        camCtx.fillRect(xMin - 1, yMin - 16, labelWidth + 8, 16);
        camCtx.fillStyle = '#052e16';
        camCtx.fillText(label, xMin + 3, yMin - 4);

        // Ground Speed Overlay Tag
        camCtx.fillStyle = 'rgba(0,0,0,0.75)';
        camCtx.fillRect(xMin, yMin + boxHeight + 4, 66, 14);
        camCtx.fillStyle = '#38bdf8';
        camCtx.fillText(`${ent.speedKmh} km/h`, xMin + 4, yMin + boxHeight + 15);
      });
    }

    // ==========================================
    // 3. THREE.JS 3D DIGITAL TWIN VIEWPORT
    // ==========================================
    const twinContainer = document.getElementById('twinContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);

    const camera = new THREE.PerspectiveCamera(55, twinContainer.clientWidth / twinContainer.clientHeight, 0.1, 1000);
    camera.position.set(0, 30, 35);
    camera.lookAt(0, 0, -35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(twinContainer.clientWidth, twinContainer.clientHeight);
    twinContainer.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = twinContainer.clientWidth / twinContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(twinContainer.clientWidth, twinContainer.clientHeight);
    });

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 3D Road
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 400), roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    scene.add(roadMesh);

    // Coordinate Reference Grid
    const grid = new THREE.GridHelper(300, 60, 0x1e293b, 0x0f172a);
    grid.position.y = -0.05;
    scene.add(grid);

    // Mesh builder for Digital Twin objects
    function createTwinMesh(entity) {
      const geo = new THREE.BoxGeometry(entity.width, entity.height, entity.length);
      const mat = new THREE.MeshStandardMaterial({
        color: entity.color,
        roughness: 0.3,
        metalness: 0.2
      });
      const mesh = new THREE.Mesh(geo, mat);

      // Digital Twin Structural Wireframe Overlay
      const wire = new THREE.LineSegments(
        new THREE.WireframeGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 1 })
      );
      mesh.add(wire);

      scene.add(mesh);
      return mesh;
    }

    // ==========================================
    // 4. SYNCHRONIZATION AND RENDER LOOP
    // ==========================================
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsClock = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // FPS Counter
      frameCount++;
      fpsClock += delta;
      if (fpsClock >= 0.5) {
        document.getElementById('val-fps').innerText = Math.round(frameCount / fpsClock);
        frameCount = 0;
        fpsClock = 0;
      }

      // Update positions strictly via velocity without smoothing or value modification
      for (let i = activeEntities.length - 1; i >= 0; i--) {
        const ent = activeEntities[i];
        const mps = ent.speedKmh * (1000 / 3600);
        ent.z += mps * delta;

        if (!ent.twinMesh) {
          ent.twinMesh = createTwinMesh(ent);
        }

        // Apply raw coordinate projection into 3D twin space
        ent.twinMesh.position.set(ent.x, ent.height / 2, -ent.z);

        // Remove entity when it exits the monitored horizon
        if (ent.z > 60) {
          scene.remove(ent.twinMesh);
          ent.twinMesh.geometry.dispose();
          ent.twinMesh.material.dispose();
          activeEntities.splice(i, 1);
        }
      }

      // Maintain steady traffic density
      if (activeEntities.length < 7 && Math.random() < 0.05) {
        activeEntities.push(createEntity());
      }

      // Telemetry HUD Update
      document.getElementById('val-entities').innerText = activeEntities.length;

      // Render Synchronized Cameras
      renderDetectionOverlay();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
