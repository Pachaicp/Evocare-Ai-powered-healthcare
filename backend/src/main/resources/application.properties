# ===================================================
# EvoCare - Application Configuration
# ===================================================

spring.application.name=evocare-backend

# --- Database (H2 In-Memory - Zero setup required) ---
spring.datasource.url=jdbc:h2:mem:evocaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Server ---
server.port=8081
server.servlet.context-path=/api

# --- JWT ---
app.jwt.secret=EvoCare@SecretKey#2024$SpringBoot#JWT#AuthKey#ElderCare@Platform
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --- Gemini AI ---
app.gemini.api-key=YOUR_GEMINI_API_KEY_HERE
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# --- Logging ---
logging.level.com.evocare=DEBUG
logging.level.org.springframework.security=WARN

# --- Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
