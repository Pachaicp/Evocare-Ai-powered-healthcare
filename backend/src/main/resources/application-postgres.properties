# ===================================================
# EvoCare - PostgreSQL Database Configuration
# ===================================================

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/evocare_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=8081
server.servlet.context-path=/api

# --- JWT ---
app.jwt.secret=EvoCare@SecretKey#2024$SpringBoot#JWT#AuthKey#ElderCare@Platform
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --- Gemini AI ---
app.gemini.api-key=YOUR_GEMINI_API_KEY_HERE
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# --- Logging ---
logging.level.com.evocare=DEBUG
logging.level.org.springframework.security=WARN

# --- Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
